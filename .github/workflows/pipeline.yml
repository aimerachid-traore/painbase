name: PainBase Data Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'   # toutes les 6h
  workflow_dispatch:          # lancement manuel depuis Actions

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: pipeline/package.json

      - name: Install dependencies
        run: npm install
        working-directory: pipeline

      - name: Run collector
        run: node collect.js
        working-directory: pipeline
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          # Reddit et HN : JSON public, pas de secrets requis

# ── 2 secrets à ajouter dans GitHub → Settings → Secrets → Actions :
#    SUPABASE_URL           → URL du projet Supabase
#    SUPABASE_SERVICE_KEY   → service_role key (Settings → API)
#    GROQ_API_KEY           → clé gratuite sur console.groq.com
