name: PainBase Data Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'   # toutes les 6h (gratuit sur GitHub Actions)
  workflow_dispatch:          # lancement manuel depuis l'onglet Actions

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pipeline/package.json

      - name: Install dependencies
        run: npm install
        working-directory: pipeline

      - name: Run collector
        run: node collect.js
        working-directory: pipeline
        env:
          SUPABASE_URL:           ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY:   ${{ secrets.SUPABASE_SERVICE_KEY }}
          REDDIT_CLIENT_ID:       ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET:   ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME:        ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD:        ${{ secrets.REDDIT_PASSWORD }}
          ANTHROPIC_API_KEY:      ${{ secrets.ANTHROPIC_API_KEY }}

# ── Pour configurer les secrets GitHub :
#    Repo → Settings → Secrets and variables → Actions → New repository secret
