name: PainBase — Collecte des données

on:
  schedule:
    - cron: '0 */6 * * *'   # Toutes les 6 heures (00h, 06h, 12h, 18h UTC)
  workflow_dispatch:          # Lancement manuel depuis GitHub UI → Actions → Run workflow

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: pipeline/package-lock.json

      - name: Install pipeline dependencies
        run: cd pipeline && npm install

      - name: Run collector
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GROQ_API_KEY:         ${{ secrets.GROQ_API_KEY }}
          APIFY_TOKEN:          ${{ secrets.APIFY_TOKEN }}
        run: cd pipeline && node collect.js
